{%- comment -%}
  One iPhone screenshot, shown 280 px wide (the PNG is 600 px, about 2x).
  Usage: {% include shot.html src="credentials.png" alt="What it shows" caption="Optional caption" %}
  Images come from /assets/img, regenerated by tools/screenshots/capture.sh.
{%- endcomment -%}
<figure class="shot">
  <img src="{{ '/assets/img/' | append: include.src | relative_url }}" alt="{{ include.alt }}" width="280" loading="lazy">
  {%- if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {%- endif %}
</figure>
