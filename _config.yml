title: iOS Wallet
description: Landing page, user guide and integration notes for the VCu iOS Wallet, a native iPhone wallet that holds OpenID4VCI credentials and answers OpenID4VP requests.

# Project site: https://sideos.github.io/vcu-ios-app-doc/
url: https://sideos.github.io
baseurl: /vcu-ios-app-doc

# Theme is fetched by GitHub Pages at build time; pinned so a theme release
# can't change the site underneath us. Bump deliberately.
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

# sideos brand: _sass/color_schemes/sideos.scss, fonts and layout in _sass/custom/custom.scss.
color_scheme: sideos

# The wallet build the screenshots and descriptions were produced from.
# Shown on the home page; update it together with tools/screenshots/capture.sh.
wallet_build: "24"

defaults:
  - scope:
      path: ""
    values:
      layout: default

search_enabled: true
heading_anchors: true

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

aux_links:
  "Docs source":
    - "https://github.com/sideos/vcu-ios-app-doc"
  "Browser wallet":
    - "https://sideos.github.io/vcu-browser-wallet-doc/"
aux_links_new_tab: true

footer_content: "Test and reference wallet. Not for production use."

# Build tooling and repo housekeeping, not site content.
exclude:
  - README.md
  - tools/
  - Gemfile
  - Gemfile.lock
  - vendor/
